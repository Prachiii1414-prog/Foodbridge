<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>Administrator sign in | FoodBridge</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="brand auth-brand" href="/">
      <img src="/static/assets/images/logo.svg" alt="" class="brand-logo">
      <span>Food<span class="brand-green">Bridge</span><small>ADMINISTRATION</small></span>
    </a>
    <section class="auth-card">
      <p class="eyebrow">RESTRICTED ACCESS</p>
      <h1>Administrator sign in</h1>
      <p class="auth-intro">Administrator accounts are provisioned by the system operator. Public registration is not available.</p>
      <form id="adminLoginForm">
        <div class="field">
          <label for="email">Administrator email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p class="form-message" id="formMessage" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Sign in to admin panel</button>
      </form>
      <p class="auth-switch"><a href="/login">Hotel / NGO sign in</a></p>
    </section>
    <p class="auth-foot">FoodBridge · Administrator access</p>
  </main>
  <script src="/static/js/auth.js"></script>
</body>
</html>
