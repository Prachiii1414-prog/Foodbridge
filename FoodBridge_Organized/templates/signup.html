<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f5b">
  <title>Create account | FoodBridge</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <a class="brand auth-brand" href="/">
      <img src="/static/assets/images/logo.svg" alt="" class="brand-logo">
      <span>Food<span class="brand-green">Bridge</span><small>LESS WASTE. MORE SMILES.</small></span>
    </a>
    <section class="auth-card">
      <p class="eyebrow">JOIN THE FOOD NETWORK</p>
      <h1>Create your account</h1>
      <p class="auth-intro">Register your Hotel to share surplus food, or your NGO to request available food.</p>
      <form id="signupForm">
        <div class="field">
          <label for="name">Organization name</label>
          <input id="name" name="name" autocomplete="organization" minlength="2" maxlength="160" required>
        </div>
        <div class="field">
          <label for="role">Account type</label>
          <select id="role" name="role" required>
            <option value="hotel">Hotel / Food donor</option>
            <option value="ngo">NGO / Food recipient</option>
          </select>
        </div>
        <div class="field">
          <label for="email">Email address</label>
          <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required>
        </div>
        <div class="field">
          <label for="password">Password <span class="field-hint">(at least 10 characters)</span></label>
          <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" maxlength="256" required>
        </div>
        <p class="form-message" id="formMessage" role="alert"></p>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
      <p class="auth-switch">Already registered? <a href="/login">Sign in</a></p>
    </section>
    <p class="auth-foot">FoodBridge · Connecting surplus food with communities in need.</p>
  </main>
  <script src="/static/js/auth.js"></script>
</body>
</html>
